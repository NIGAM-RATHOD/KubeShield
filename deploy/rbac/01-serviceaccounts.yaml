apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api-sa
  namespace: kubeshield
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: kubeshield
# Microservice does not need to talk to the K8s API server; block token projection
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: kubeshield
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: kubeshield
# Frontend pod does not communicate with K8s API
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor-sa
  namespace: kubeshield
  labels:
    app.kubernetes.io/name: security-auditor
    app.kubernetes.io/part-of: kubeshield
# Used by security auditors / compliance scanning agents
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer-sa
  namespace: kubeshield
  labels:
    app.kubernetes.io/name: ci-cd-deployer
    app.kubernetes.io/part-of: kubeshield
# Used by CI/CD deployment automation runners
automountServiceAccountToken: false
