# =============================================================================
# Production AWS EKS SecretStore using IRSA (IAM Roles for Service Accounts)
# ZERO long-lived static credentials stored in Kubernetes secrets!
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-production-irsa-store
  labels:
    app.kubernetes.io/part-of: kubeshield-security
    environment: aws-eks-production
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-irsa-sa
            namespace: external-secrets
