apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: orders-api-db-external-secret
  namespace: kubeshield
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: kubeshield-security
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: localstack-secret-store
    kind: SecretStore
  target:
    name: orders-api-db-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: orders-api
          security.source: external-secrets-kms
  dataFrom:
    - extract:
        key: "kubeshield/orders-api/db-credentials"
