apiVersion: v1
kind: Secret
metadata:
  name: localstack-credentials
  namespace: kubeshield
  labels:
    app.kubernetes.io/part-of: kubeshield-security
type: Opaque
stringData:
  access-key-id: "test"
  secret-access-key: "test"
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: localstack-secret-store
  namespace: kubeshield
  labels:
    app.kubernetes.io/part-of: kubeshield-security
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # Points to the host gateway running LocalStack from Kind nodes
      endpoint: "http://host.docker.internal:4566"
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: localstack-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: localstack-credentials
            key: secret-access-key
