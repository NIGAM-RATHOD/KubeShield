kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubeshield
networking:
  # Disable kindnet so Calico CNI can be installed to enforce NetworkPolicies
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000
        protocol: TCP
  - role: worker
    labels:
      tier: app
  - role: worker
    labels:
      tier: security
