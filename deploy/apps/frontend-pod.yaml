apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: kubeshield
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: kubeshield-security
spec:
  serviceAccountName: frontend-sa
  automountServiceAccountToken: false
  restartPolicy: Always

  # Enforce Pod Security Admission Restricted profile
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: tmp-volume
          mountPath: /tmp

  volumes:
    - name: tmp-volume
      emptyDir:
        sizeLimit: 16Mi
