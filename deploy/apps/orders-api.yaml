apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: kubeshield
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: kubeshield-security
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        app.kubernetes.io/part-of: kubeshield-security
    spec:
      serviceAccountName: orders-api-sa
      # CIS Benchmark 5.1.5: Explicitly disable API token automount
      automountServiceAccountToken: false

      # Pod-level security context (Pod Security Standard: Restricted)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: orders-api
          image: orders-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Container-level security context (Pod Security Standard: Restricted)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Inject database credentials synced by External Secrets Operator
          envFrom:
            - secretRef:
                name: orders-api-db-secret
                optional: true

          env:
            - name: ENVIRONMENT
              value: "production-hardened"
            - name: PYTHONUNBUFFERED
              value: "1"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # Writable ephemeral volume for temporary application files without violating readOnlyRootFilesystem
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2

      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: kubeshield
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: kubeshield-security
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
