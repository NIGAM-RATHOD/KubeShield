version: "3.8"

services:
  localstack:
    image: localstack/localstack:3.3.0
    container_name: kubeshield-localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services range
    environment:
      - SERVICES=kms,secretsmanager,sts
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DEBUG=0
    volumes:
      - "./localstack/init-scripts:/etc/localstack/init/ready.d"
      - "localstack_data:/var/lib/localstack"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  localstack_data:
